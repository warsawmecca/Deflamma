server {
    listen 80;
    server_name deflamma.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://deflamma.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    server_name deflamma.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/deflamma.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deflamma.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    gzip on;
    gzip_types application/json text/css application/javascript;
    add_header X-Content-Type-Options nosniff always;
    location = /admin {
        auth_basic "Deflamma admin";
        auth_basic_user_file /etc/nginx/himawari.htpasswd;
        include /etc/nginx/snippets/himawari-proxy.conf;
        proxy_pass http://127.0.0.1:8765/latest_heatmap.html;
    }
    # Reviewer tokens are verified by the app; do not strip them or request Basic auth.
    location ^~ /api/reviews {
        limit_except GET POST { deny all; }
        proxy_set_header Host deflamma.duckdns.org;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Himawari-Admin "";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8765;
    }
    location /api/ {
        limit_except GET {
            auth_basic "Deflamma admin";
            auth_basic_user_file /etc/nginx/himawari.htpasswd;
        }
        include /etc/nginx/snippets/himawari-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/watches {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/himawari-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/archive {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/himawari-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location / {
        # POST/DELETE aliases must not bypass the /api/ authentication block.
        limit_except GET { deny all; }
        include /etc/nginx/snippets/himawari-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
}
